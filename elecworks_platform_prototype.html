<style>
:root{
  --ink:#171b21; --ink2:#4a5561; --ink3:#8a94a1;
  --line:#e4e1da; --bg:#f4f2ee; --panel:#ffffff;
  --brand:#1c5d99; --brand-d:#14456f; --copper:#b08434; --copper-l:#e9dcc3;
  --ok:#1e7d4f; --warn:#b06a00; --bad:#b3372b;
  --side:#12161d; --side2:#1b212b; --side-txt:#aeb7c2;
  --sh:0 1px 2px rgba(20,25,35,.05),0 8px 24px rgba(20,25,35,.07);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}
.en body,body.en{font-family:'Inter','Segoe UI',sans-serif}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 18px;background:#eceae4;color:var(--ink);font-weight:600;transition:.18s}
button:hover{filter:brightness(.96)}
button.pri{background:var(--brand);color:#fff}
button.pri:hover{background:var(--brand-d)}
button.gold{background:var(--copper);color:#fff}
button.sm{padding:4px 12px;font-size:12px;border-radius:6px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(28,93,153,.25);border-color:var(--brand)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:60;height:60px;background:var(--side);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:3px solid var(--copper)}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}
.logo .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--copper),#d4b06a);display:flex;align-items:center;justify-content:center;color:#12161d}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--side-txt);letter-spacing:2px}
.spacer{flex:1}
.top select{width:auto;background:var(--side2);color:#fff;border-color:#2c3542}
.top .pill{font-size:12px;background:var(--side2);border:1px solid #2c3542;padding:6px 14px;border-radius:99px;color:var(--side-txt)}
.wrap{display:flex;min-height:calc(100vh - 60px)}
/* ===== sidebar ===== */
.side{width:252px;background:var(--side);color:var(--side-txt);padding:18px 12px;flex-shrink:0}
.sec-h{font-size:10.5px;letter-spacing:2px;color:#5c6672;padding:10px 12px 6px;font-weight:700}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px;font-weight:600;font-size:13.5px;border-inline-start:3px solid transparent}
.navitem:hover{background:var(--side2);color:#fff}
.navitem.active{background:linear-gradient(90deg,rgba(176,132,52,.18),transparent);color:#f0d9ac;border-inline-start-color:var(--copper)}
.navitem.locked{opacity:.4;cursor:not-allowed}
.navitem .n{font-size:10px;background:var(--side2);border-radius:6px;padding:2px 8px;color:#8a94a1;font-weight:700}
.navitem.active .n{background:var(--copper);color:#12161d}
.side .foot{margin-top:22px;padding:12px;font-size:11px;color:#5c6672;border-top:1px solid #232a35;line-height:1.8}
.main{flex:1;padding:26px 30px;max-width:1240px}
h2.pt{font-size:21px;font-weight:800}
p.ps{font-size:13px;color:var(--ink2);margin:2px 0 18px}
/* ===== cards & grids ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.g::before{background:var(--copper)}.kpi.ok::before{background:var(--ok)}.kpi.bad::before{background:var(--bad)}
.kpi .v{font-size:26px;font-weight:800}.kpi .l{font-size:12px;color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{font-size:15px;font-weight:700}
.hero{border-radius:16px;overflow:hidden;position:relative;margin-bottom:20px;box-shadow:var(--sh);border:1px solid var(--line)}
.hero img{width:100%;height:250px;object-fit:cover;display:block}
.hero .ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,14,20,.85) 8%,rgba(10,14,20,.25) 55%,transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff}
.hero .ov h2{font-size:22px;font-weight:800}.hero .ov p{font-size:13px;color:#cfd6de}
.fimg{border-radius:10px;overflow:hidden;position:relative;background:var(--side);min-height:120px;display:flex;align-items:center;justify-content:center}
.fimg img{width:100%;height:130px;object-fit:cover;display:block}
.fimg .cap{position:absolute;bottom:0;inset-inline:0;background:linear-gradient(0deg,rgba(10,14,20,.8),transparent);color:#fff;font-size:11.5px;padding:16px 10px 6px}
.fimg .fb{display:none;position:absolute;inset:0;color:#5c6672;font-size:12px;flex-direction:column;align-items:center;justify-content:center;gap:6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f5f0;text-align:start;font-weight:700;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fbfaf7}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.st{font-size:11.5px;padding:3px 11px;border-radius:99px;display:inline-block;white-space:nowrap;font-weight:700}
.st.done{background:#e5f5ec;color:var(--ok)}.st.prog{background:#fdf2df;color:var(--warn)}.st.pend{background:#eef0f3;color:var(--ink2)}.st.high{background:#fbeae8;color:var(--bad)}
.bar{height:7px;background:#e9e6df;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#3f8cc4);border-radius:99px}
/* phases */
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:14px 0}
.ph{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel)}
.ph .t{font-size:12px;font-weight:800}.ph .s{font-size:11px;color:var(--ink2);margin-top:3px}
.ph.done{border-color:#1e7d4f66;background:#f3faf6}.ph.prog{border-color:#b06a0066;background:#fffaf1}.ph.pend{opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:5px}
/* tabs & forms */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink2);border-radius:0;font-weight:600}
.tab.active{color:var(--brand);border-bottom-color:var(--copper);font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:700}
.result-ok{background:#f0faf4;border:1px solid #1e7d4f44;color:var(--ok);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700}
.result-bad{background:#fdf2f1;border:1px solid #b3372b44;color:var(--bad);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700}
.outbox{background:linear-gradient(180deg,#f6f8fb,#fdfcf9);border:1px solid #d8dee6;border-radius:12px;padding:18px}
.outbox .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #d3d9e0;font-size:13.5px}
.outbox .row:last-child{border:none}
.code-tag{font-size:11px;background:var(--copper-l);border-radius:6px;padding:2px 10px;color:#7a5a1d;font-weight:700}
/* ===== sketch & drawing sheets ===== */
.sheet{background:#fff;border:1.5px solid #2a2f38;border-radius:4px;padding:14px;box-shadow:var(--sh);overflow:auto}
.sheet svg{display:block;margin:0 auto;max-width:100%}
.sheet-cap{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--ink2)}
.sketch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.sk-thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:var(--sh);transition:.18s}
.sk-thumb:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,25,35,.12)}
.sk-thumb svg{width:100%;height:150px;display:block;background:#fff}
.sk-thumb .lbl{padding:10px 14px;border-top:1px solid var(--line)}
.sk-thumb .lbl b{font-size:13px}.sk-thumb .lbl span{font-size:11px;color:var(--ink3);display:block}
/* ===== standard forms ===== */
.form-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:20px}
.fp-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);cursor:pointer;box-shadow:var(--sh);transition:.18s}
.fp-card:hover{transform:translateY(-2px);border-color:var(--copper)}
.fp-card .ic{width:42px;height:42px;border-radius:10px;background:var(--copper-l);display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--copper)}
.fp-card b{font-size:13.5px}
.fp-card span{display:block;font-size:11.5px;color:var(--ink2);margin-top:3px}
.doc{background:#fff;border:2px solid var(--ink);padding:0;max-width:900px;margin:0 auto}
.doc .frame{border:1px solid var(--ink);margin:8px;padding:18px;position:relative}
.doc-head{display:grid;grid-template-columns:120px 1fr 190px;gap:12px;align-items:stretch;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.doc-head .logoBox{border:1.5px dashed var(--ink3);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);text-align:center;min-height:70px}
.doc-head .co{text-align:center}
.doc-head .co h1{font-size:16px;font-weight:800}
.doc-head .co p{font-size:11px;color:var(--ink2)}
.doc-meta{font-size:11px}
.doc-meta table{border:1px solid var(--ink)}
.doc-meta td{border:1px solid var(--ink);padding:3px 8px;font-size:11px}
.doc-title{text-align:center;font-size:15px;font-weight:800;background:#f4f2ee;border:1px solid var(--ink);padding:8px;margin-bottom:14px;letter-spacing:.5px}
.doc table.fld{width:100%;margin-bottom:12px}
.doc table.fld td{border:1px solid var(--ink);padding:6px 10px;font-size:12.5px;height:32px}
.doc table.fld td.l{background:#f7f5f0;font-weight:700;width:170px;font-size:12px}
.doc input{border:none;border-bottom:1px dotted var(--ink3);border-radius:0;padding:0 4px;background:transparent}
.doc input:focus{outline:none;border-bottom-color:var(--brand)}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.sign .b{border:1px solid var(--ink);height:74px;padding:6px 10px;font-size:11.5px;font-weight:700}
.sign .b small{display:block;font-weight:400;color:var(--ink3);margin-top:22px;font-size:10px}
/* ===== site photos ===== */

.ph-card .bd{padding:10px 13px;font-size:12px}
.ph-card .bd b{font-size:12.5px}
.ph-card .meta{font-size:11px;color:var(--ink3);margin-top:2px}
.upzone{border:2px dashed var(--copper);border-radius:14px;padding:26px;text-align:center;background:#fdfaf3;color:var(--ink2);margin-bottom:18px;cursor:pointer}
.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:99;display:none;box-shadow:var(--sh)}
#printArea{display:none}

}

/* ===== refinement fixes ===== */
.top{flex-wrap:wrap;height:auto;min-height:60px}
#projSel{max-width:230px;text-overflow:ellipsis}
.tabs{flex-wrap:nowrap;overflow-x:auto}
.tab{white-space:nowrap;flex:0 0 auto}
.ps,.muted,.code-tag,.st,.doc td,.doc input,.kpi .l{unicode-bidi:plaintext}
td input,td select{min-width:64px}
input[type=checkbox],input[type=radio]{width:auto}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brand);cursor:pointer;margin-bottom:10px;padding:4px 14px;background:#0f4c8110;border:1px solid #0f4c8125;border-radius:99px;width:fit-content}
.crumb:hover{background:#0f4c8122}
h2.pt,p.ps,.card,.kpi,.doc-title{overflow-wrap:break-word}
.hero .ov h2,.hero .ov p{overflow-wrap:break-word;max-width:90%}
.outbox .row{gap:12px}
.outbox .row span:last-child{text-align:end}

 .main{padding-bottom:88px}
}

html,body{min-height:100%}
body{display:flex;flex-direction:column}
.top{flex:0 0 auto}
.wrap{display:flex;flex:1 0 auto;width:100%;min-height:0}

.side{display:flex;flex-direction:column}

const SETTINGS={dvLight:4,dvPower:5};
function Ib(P,V,pf,ph){return ph===3?P/(Math.sqrt(3)*V*pf):P/(V*pf);}
function nextBreaker(i){for(const b of BREAKERS){if(b>=i)return b;}return BREAKERS[BREAKERS.length-1];}
function designCircuit(P,V,pf,ph,len,method,derating,Ik,tsc,sys){
  const ib=Ib(P,V,pf,ph),inB=nextBreaker(ib),need=inB/derating;
  let chosen=null;
  for(const c of CABLES){
    const iz=(method==='D'?c.izD:c.izC)*derating;
    if(iz<need)continue;
    const R=c.r*len/1000,X=c.x*len/1000,sin=Math.sqrt(Math.max(0,1-pf*pf));
    let dv=ph===3?Math.sqrt(3)*inB*(R*pf+X*sin)/V*100:2*inB*(R*pf+X*sin)/V*100;
    const limit=sys==='lighting'?SETTINGS.dvLight:SETTINGS.dvPower;
    if(dv<=limit){chosen={c,iz,dv,limit};break;}
    chosen={c,iz,dv,limit};
  }
  const k=115,scOk=Ik===0||(k*chosen.c.s>=Ik*1000*Math.sqrt(tsc));
  return {ib:+ib.toFixed(1),inB,size:chosen.c.s,iz:+chosen.iz.toFixed(1),dv:+chosen.dv.toFixed(2),limit:chosen.limit,dvOk:chosen.dv<=chosen.limit,scOk,ok:(chosen.dv<=chosen.limit&&scOk&&chosen.iz>=inB)};
}

function tblTasks(p){
 const mains=p.tasks.map(function(tk,i){return {tk:tk,i:i};}).filter(function(x){return !x.tk.parent;});
 const row=function(x,depth){
  const tk=x.tk;const st=taskSt(tk);const sla=taskSLA(tk);
  const subs=taskSubs(p,tk.id);
  const prog=subs.length?taskProg(p,tk):null;
  let h='<tr'+(depth?' style="background:#faf8f4"':'')+'><td class="num">'+(depth?'└':'')+(x.i+1)+'</td>'
   +'<td'+(depth?' style="padding-inline-start:'+(18+depth*16)+'px;font-size:12.5px"':'')+'>'+esc(tk.t)+(subs.length?' <span class="code-tag">'+subs.length+' '+TT('فرعية','sub')+'</span>':'')+'</td>'
   +'<td>'+esc(tk.o)+'</td>'
   +'<td class="num" style="color:'+(sla===2?'var(--bad)':sla===1?'var(--warn)':'inherit')+';font-weight:'+(sla>0?700:400)+'">'+tk.d+(sla===2?' ⛔':sla===1?' ⏳':'')+'</td>'
   +'<td><select style="min-width:120px" onchange="taskSet('+x.i+',this.value)">'+TST_WF.map(function(w){return '<option value="'+w+'"'+(st===w?' selected':'')+'>'+TT(TST_WF_L[w][0],TST_WF_L[w][1])+'</option>';}).join('')+'</select></td>'
   +'<td>'+stChip(tk.s)+(prog!==null?' <span class="muted num" style="font-size:11px">'+prog+'%</span>':'')+'</td>'
   +'<td style="white-space:nowrap">';
  if(!depth){h+='<button class="sm" onclick="toggleSub('+tk.id+')">'+(TASKEXP[tk.id]?'▾':'▶')+'</button> ';}
  h+='<button class="sm" onclick="taskCycle('+x.i+')">⇄</button> <button class="sm" onclick="p=proj();p.tasks.splice('+x.i+',1);saveDB();toast(\'deleted\');render()">'+t('del')+'</button></td></tr>';
  return h;};
 let body='';
 mains.forEach(function(x){
  body+=row(x,0);
  const subs=taskSubs(p,x.tk.id);
  if(subs.length&&TASKEXP[x.tk.id]){
   subs.forEach(function(tk){body+=row({tk:tk,i:p.tasks.indexOf(tk)},1);});
   body+='<tr style="background:#fff"><td></td><td colspan="6" style="padding:4px 10px"><div style="display:flex;gap:8px"><input id="subIn'+x.tk.id+'" placeholder="'+TT('مهمة فرعية جديدة…','New sub-task…')+'" style="max-width:340px;padding:5px 10px;font-size:12.5px"><button class="sm" onclick="addSub('+x.i+')">+ '+TT('فرعية','Sub')+'</button></div></td></tr>';
  }});
 if(!mains.length)body='<tr><td colspan="7" class="muted">—</td></tr>';
 return '<div class="tblwrap"><table>'
 +'<tr><th>#</th><th>'+t('task')+'</th><th>'+t('owner')+'</th><th>'+t('due')+'</th><th>'+TT('سير العمل','Workflow')+'</th><th>'+t('status')+'</th><th></th></tr>'
 +body+'</table></div>';
}

function sldPort(el,p){const d=(el.type==='bus'&&el.busW)?Object.assign({},SLD_TYPES[el.type],{w:el.busW}):SLD_TYPES[el.type];
 if(p==='t')return[el.x+d.w/2,el.y]; if(p==='b')return[el.x+d.w/2,el.y+d.h];
 if(p==='l')return[el.x,el.y+d.h/2]; if(p==='r')return[el.x+d.w,el.y+d.h/2];
 return[el.x+d.w/2,el.y+d.h/2];}
function nearestPortXY(el,m){const ps=SLD_TYPES[el.type].ports;let best=null,bd=1e9;
 ps.forEach(p=>{const q=sldPort(el,p);const d=(q[0]-m.x)**2+(q[1]-m.y)**2;if(d<bd){bd=d;best=q;}});
 return best||[el.x+SLD_TYPES[el.type].w/2,el.y+SLD_TYPES[el.type].h/2];}
function sldBestPorts(a,b){
 const pa=SLD_TYPES[a.type].ports.length?SLD_TYPES[a.type].ports:['c'];
 const pb=SLD_TYPES[b.type].ports.length?SLD_TYPES[b.type].ports:['c'];
 let best=null,bd=1e9;
 pa.forEach(x=>{pb.forEach(y=>{const A=sldPort(a,x),B=sldPort(b,y);
  const d=(A[0]-B[0])**2+(A[1]-B[1])**2;if(d<bd){bd=d;best=[A,B];}});});
 return best;}

 else if(el.type==='panel')g=`<rect x="6" y="6" width="${d.w-12}" height="${d.h-12}" fill="#f6f8fb" stroke="#1c5d99" stroke-width="1.6"/><line x1="6" y1="14" x2="${d.w-6}" y2="14" stroke="#1c5d99" stroke-width="1"/>`;
 return g;}

/* ===== STEP 2: SHORT CIRCUIT STUDY (IEC 60909 simplified) ===== */
let SCC={src:'trafo',kva:1000,zp:6,xr:6,sk:250,t:0.1,res:null};
try{SCC=Object.assign(SCC,JSON.parse(sessionStorage.getItem('scc_v1')||'{}'));}catch(e){}
function sccSave(){try{sessionStorage.setItem('scc_v1',JSON.stringify(SCC));}catch(e){}}
function sccSourceZ(){const Un=400;let z;
 if(SCC.src==='trafo'){z=(SCC.zp/100)*(Un*Un/(SCC.kva*1000));}
 else{z=(Un*Un/(SCC.sk*1e6));}
 const r=z/Math.sqrt(1+SCC.xr*SCC.xr);
 return {r:r,x:r*SCC.xr};}
function computeScc(){
 const zs=sccSourceZ(),c=(SCC.src==='trafo'?1.05:1.1),Un=400,k=115;
 const totIb=CIRCUITS.reduce((a,ct)=>a+Ib(ct.P*ct.df,ct.V,ct.pf,ct.ph),0);
 const upIn=nextBreaker(totIb);
 return CIRCUITS.map(ct=>{
  const r=designCircuit(ct.P*ct.df,ct.V,ct.pf,ct.ph,ct.len,ct.m,0.87,0,0.1,ct.sys);
  const cab=CABLES.find(x=>x.s===r.size)||CABLES[CABLES.length-1];
  const R=zs.r+cab.r*ct.len/1000, X=zs.x+cab.x*ct.len/1000;
  const Z=Math.sqrt(R*R+X*X);
  const ikA=c*Un/(Math.sqrt(3)*Z);
  const tClr=(r.inB<=63)?0.01:SCC.t;
  const ik3=ikA/1000, ik2=0.866*ik3;
  const kap=1.02+0.98*Math.exp(-3*R/Math.max(X,0.001));
  const ip=Math.sqrt(2)*kap*ik3;
  const smin=ikA*Math.sqrt(tClr)/k;
  return {ct:ct,r:r,ik3:ik3,ik2:ik2,ip:ip,kap:kap,smin:smin,
   ok:(r.size>=smin),sel:(upIn/r.inB>=1.6),ratio:(upIn/r.inB)};});}
function runScc(){SCC.res=computeScc();sccSave();
 logAct('دراسة قصر كهربائي IEC 60909','أقصى Ik '+Math.max.apply(null,SCC.res.map(x=>x.ik3)).toFixed(1)+' kA');
 toast('saved');render();}

/* ===== STEP 3: CODE COMPLIANCE CHECKER ===== */
let COMP={res:null,score:0,status:false};
function compChecks(){
 const rows=[];
 const A=(id,name,cat,pass,detail,rec)=>rows.push({id:id,name:name,cat:cat,pass:!!pass,detail:detail||'',rec:rec||''});
 const loads=CIRCUITS.map(c=>({c:c,r:designCircuit(c.P*c.df,c.V,c.pf,c.ph,c.len,c.m,0.87,0,0.1,c.sys)}));
 const dvBad=loads.filter(x=>!x.r.dvOk);
 A('VD','نزول الجهد ضمن الحدود (إنارة 4% / قوى 5%)','حرج',dvBad.length===0,dvBad.map(x=>x.c.n+' '+x.r.dv+'%').join('،'),dvBad.length?'زوّد مقطع: '+dvBad[0].c.n:'');
 const totIb=CIRCUITS.reduce((a2,c)=>a2+Ib(c.P*c.df,c.V,c.pf,c.ph),0);
 const upIn=nextBreaker(totIb);
 const selBad=loads.filter(x=>upIn/x.r.inB<1.6);
 A('SEL','تنسيق حماية القواطع (الرئيسي ≥ 1.6× الفرعي)','حرج',selBad.length===0,selBad.map(x=>x.c.n).join('،'),'راجع دراسة القصر والتنسيق الزمني');
 const scc=computeScc();const sccBad=scc.filter(x=>!x.ok);
 A('SCC','تحمّل الكابلات لتيار القصر (k²S² ≥ I²t)','حرج',sccBad.length===0,sccBad.map(x=>x.ct.n+' يحتاج '+x.smin.toFixed(1)+'mm²').join('،'),'كبّر المقطع أو قصّر زمن الفصل');
 A('SPR','Spare Ways 25% في اللوحة الرئيسية','حرج',SLD_ELS.some(e=>e.type==='spare'),SLD_ELS.some(e=>e.type==='spare')?'موجود':'مستبعد', 'أضف عنصر Spare في محرر SLD');
 A('ELV','تغذية مستقلة لأنظمة التيار الخفيف','حرج',CIRCUITS.some(c=>c.sys==='elv'),'','أضف دائرة ELV منفصلة');
 A('LD','جدول الأحمال مكتمل (Ib / In / مقطع)','حرج',loads.every(x=>x.r.inB>0&&x.r.size>0),'','');
 A('BOQ','جدول الكميات BOQ مُنشأ ومحدّث','حرج',BOQ.length>0,BOQ.length+' بند','حوّل الحصر التلقائي لـ BOQ');
 testsEnsure();
 const tBad=TESTS.filter(t=>!t.st);
 A('TST','نتائج الاختبارات مقبولة وموثقة ('+TESTS.length+' اختبار)','إرشادي',tBad.length===0&&TESTS.length>=4,tBad.map(t=>t.n).join('،'),'أعد الاختبارات الراسبة ووثّقها');
 A('EAR','مقاومة التأريض موثقة (≤ 1Ω)','إرشادي',TESTS.some(t=>t.n.indexOf('تأريض')>=0&&t.st),'','سجّل قياس Fall-of-Potential');
 if(!PTS.length)PTS=PT_DEMO.map(p2=>Object.assign({},p2));
 const pc={};PTS.forEach(p2=>pc[p2.type]=(pc[p2.type]||0)+1);
 A('EMR','نقاط إنارة الطوارئ موزعة','إرشادي',(pc.em||0)>0,(pc.em||0)+' نقطة','أضف نقاط EM عند المخارج والممرات');
 const p=proj();const open=p.rfis.filter(x=>x.o===1).length;
 A('RFI','لا مراسلات RFI معلقة','إرشادي',open===0,open+' مفتوحة','اطلب الردود قبل الاعتماد');
 const hr=p.risks.filter(x=>x.i==='high'&&!x.m);
 A('RSK','المخاطر المرتفعة لها إجراء وقائي','إرشادي',hr.length===0,hr.map(x=>x.t).join('،'),'حدد mitigation لكل خطر مرتفع');
 return rows;}
function runComp(){COMP.res=compChecks();
 const crit=COMP.res.filter(x=>x.cat==='حرج');
 const cBad=crit.filter(x=>!x.pass).length;
 COMP.score=Math.round(COMP.res.filter(x=>x.pass).length/COMP.res.length*100);
 COMP.status=(cBad===0&&COMP.score>=90);
 logAct('فحص المطابقة الكودية',(COMP.status?'جاهز للاعتماد ✓':'يحتاج معالجة')+' · '+COMP.score+'%');
 toast('saved');render();}

/* ===== PHASE 2 — STEP 8: FIRE ALARM & ELV DESIGN (Addressable, NFPA 72/EN 54 logic) ===== */
let FA={area:5000,ceil:3,special:10,loopCap:159,loopLen:0,res:null};
try{FA=Object.assign(FA,JSON.parse(sessionStorage.getItem('fa_v1')||'{}'));}catch(e){}
function faSave(){try{sessionStorage.setItem('fa_v1',JSON.stringify(FA));}catch(e){}}
function computeFa(){
 const area=FA.area,ceil=FA.ceil;
 const covOpt=ceil<=6?75:ceil<=9?55:35;   /* m²/كاشف دخان بصري */
 const covTh=ceil<=6?50:ceil<=9?35:25;    /* m²/كاشف حراري */
 const spArea=area*FA.special/100;
 const opt=Math.ceil((area-spArea)/covOpt);
 const th=Math.ceil(spArea/covTh);
 const det=opt+th;
 const mcp=Math.max(2,Math.ceil(area/600));          /* يدوية — مسار إخلاء 61م */
 const snd=Math.ceil(area/700)+1;                     /* وحدات صوتية/ضوئية */
 const mod=Math.max(2,Math.ceil(det*0.12));           /* وحدات مراقبة/تحكم ~12% */
 const addr=det+mcp+snd+mod;
 const loops=Math.ceil(addr/FA.loopCap);
 const iQ=0.05+addr*0.0003, iA=1.5+snd*0.15;
 let battAh=Math.ceil((iQ*24+iA*0.5)/0.8);          /* 24h stand-by + 30min alarm /80% */
 battAh=Math.max(7,battAh);                              /* 7Ah minimum panel battery */
 const L=FA.loopLen||Math.round(addr*8);              /* طول الحلقة تقديري */
 const Rloop=12.1*L*2/1000;                            /* 2×1.5mm² go&return */
 const Vd=0.5*Rloop;                                   /* worst-case 0.5A */
 const vdOk=Vd<=4;
 return {opt:opt,th:th,det:det,mcp:mcp,snd:snd,mod:mod,addr:addr,loops:loops,
  iQ:iQ,iA:iA,battAh:battAh,loopLen:L,Vd:Vd,vdOk:vdOk,covOpt:covOpt,covTh:covTh};}
function runFa(){FA.res=computeFa();faSave();
 logAct('تصميم إنذار حريق',''+FA.res.addr+' عنوان · '+FA.res.loops+' لوب');
 toast('saved');render();}

let LP={L:20,W:10,H:15,td:8,cls:'norm',rho:50,rodL:3,rodD:0.016,res:null};

function lpSave(){try{sessionStorage.setItem('lp_v1',JSON.stringify(LP));}catch(e){}}
function computeLp(){
 const Ad=LP.L*LP.W+6*LP.H*(LP.L+LP.W)+9*Math.PI*LP.H*LP.H;      /* collection area m² */
 const Ng=0.1*LP.td;                                              /* flashes/km²/yr (simplified) */
 const Nd=Ng*Ad/1e6;                                              /* strikes/yr */
 const Nc=LP.cls==='haz'?1e-5:1e-4;
 const need=Nd>Nc;
 let level=null;
 if(need){const r=Nd/Nc;level=r>50?'I':r>20?'II':r>5?'III':'IV';}
 const mesh={I:[5,5],II:[10,10],III:[15,15],IV:[20,20]}[level]||[0,0];
 const spacing={I:10,II:15,III:20,IV:25}[level]||0;
 const per=2*(LP.L+LP.W);
 const downs=spacing?Math.max(2,Math.ceil(per/spacing)):0;
 const Rrod=LP.rho/(2*Math.PI*LP.rodL)*(Math.log(4*LP.rodL/LP.rodD)-1);
 const target=10;
 const nRods=Math.max(1,Math.ceil(Rrod/target));
 const Reff=Rrod/(nRods*0.8);                                     /* 0.8 utilization, spacing ≥2L */
 return {Ad:Ad,Ng:Ng,Nd:Nd,Nc:Nc,need:need,level:level,mesh:mesh,spacing:spacing,
  downs:downs,Rrod:Rrod,nRods:nRods,Reff:Reff,target:target};}

function ltUF(K){return K<0.7?0.5:K<1?0.55:K<1.5?0.6:K<2.5?0.65:K<4?0.7:0.75;}

 return LT.rooms.map((rm,i)=>{

  const Em=LT_PRESETS[rm.act][1];
  const lum=LT_LUMS.find(x=>x[0]===rm.lum)||LT_LUMS[0];

  const cols=Math.max(1,Math.round(Math.sqrt(N*rm.L/rm.W)));
  const rows=Math.max(1,Math.ceil(N/cols));
  return {rm:rm,i:i,A:A,hw:hw,K:K,UF:UF,Em:Em,lum:lum,N:N,EmAch:EmAch,W:W,
   pass:EmAch>=Em,wm2:W/A,cols:cols,rows:rows};});}

  blocks:Math.max(4,Math.ceil(120/12)),upsAh:ah};}

const C39={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn","K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn","U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn","*":"nwnnwnwnn"};
const C39_OK=Object.keys(C39).every(k=>C39[k].length===9&&(C39[k].split('w').length-1)===3);
function c39Svg(text,h){
 const u=2,wd=5,qz=14;
 const enc=('*'+String(text).toUpperCase().replace(/[^0-9A-Z\-\. \$/+%]/g,'-')+'*').split('');
 let x=qz,bars='';
 enc.forEach(ch=>{const pat=C39[ch]||C39['-'];
  for(let i=0;i<9;i++){const w=pat[i]==='w'?wd:u;
   if(i%2===0){bars+='<rect x="'+x+'" y="2" width="'+w+'" height="'+(h-4)+'" fill="#111"/>';}
   x+=w;}
  x+=u;});
 const W=x+qz;
 return '<svg width="'+W+'" height="'+h+'" viewBox="0 0 '+W+' '+h+'" xmlns="http://www.w3.org/2000/svg"><rect width="'+W+'" height="'+h+'" fill="#fff"/>'+bars+'</svg>';}

let PULL={size:35,len:60,bends:3,ang:90,rad:0.6,mu:0.15,tin:50,res:null};

function computePull(){
 const A=PULL.size;
 const w=0.05*A;                                  /* kg/m approx */
 const mu=PULL.mu, th=PULL.ang*Math.PI/180;
 const tmax=50*A;                                  /* N, 50N/mm² Cu */
 const segs=[];let T=PULL.tin;
 const straight=PULL.len/(PULL.bends+1);
 for(let i=0;i<=PULL.bends;i++){
  T=T+w*mu*straight*9.81;segs.push({n:i+1,type:LANG==='ar'?'مستقيم':'straight',T:T,ok:T<=tmax});

  payback:payback,winner:(payback<=7)?'bus':'cab'};}

const TRAFO_TBL=[[250,0.9,3.5],[500,1.3,6.0],[800,1.8,9.0],[1000,2.1,11.0],[1250,2.5,13.0],[1600,3.0,16.0],[2000,3.6,20.0]];

function computeTrafo(){

 const lf=TRAFO.load/100;
 const losses=t[1]+t[2]*lf*lf;
 const out=t[0]*lf;
 const eff=out/(out+losses)*100;
 const yearlyLoss=losses*8760;
 return {size:t[0],po:t[1],pk:t[2],losses:losses,out:out,eff:eff,yearlyLoss:yearlyLoss};}

  ok:fill<=60};}

const storage={
 _p:[],
 register(p){this._p.push(p);},
 get(key,fallback){let v=null;for(const p of this._p){const r=p.get(key,null);if(r!=null){v=r;break;}}return v==null?(fallback!==undefined?fallback:null):v;},
 set(key,val){this._p.forEach(p=>{try{p.set(key,val);}catch(e){}});return val;},
 update(key,fn){const v=JSON.parse(this.get(key,'null'));const nv=fn(v);this.set(key,JSON.stringify(nv));return nv;},
 delete(key){this._p.forEach(p=>{try{p.delete(key);}catch(e){}});},
 sync(){return Promise.all(this._p.map(p=>p.sync?p.sync():Promise.resolve(true))).then(()=>true).catch(()=>false);}
};

/* ---- IndexedDB photo store (quota-safe, cross-tab) ---- */
const PhotoStore={ok:false,db:null,
 open(){return new Promise(res=>{if(typeof indexedDB==='undefined')return res(false);
  try{const rq=indexedDB.open('elecworks-db',1);
   rq.onupgradeneeded=e=>{try{e.target.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});}catch(x){}};
   rq.onsuccess=e=>{this.db=e.target.result;this.ok=true;res(true);};
   rq.onerror=()=>res(false);}catch(x){res(false);}});},
 clear(){return new Promise(res=>{if(!this.ok)return res(false);try{const tx=this.db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(x){res(false);}});},
 add(rec){return new Promise(res=>{if(!this.ok)return res(false);try{const tx=this.db.transaction('photos','readwrite');tx.objectStore('photos').add(rec);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(x){res(false);}});},
 all(){return new Promise(res=>{if(!this.ok)return res([]);try{const out=[];const rq=this.db.transaction('photos').objectStore('photos').openCursor();
   rq.onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue();}else res(out);};
   rq.onerror=()=>res([]);}catch(x){res([]);}});}
};

/* ===== PHASE 12: TASK WORKFLOW ENGINE (additive status layer + SLA) ===== */
const TST_WF=['open','assigned','inprog','pcons','pcont','pclient','closed','rejected'];
const TST_WF_L={open:['مفتوح','Open'],assigned:['مسند','Assigned'],inprog:['قيد التنفيذ','In Progress'],
 pcons:['بانتظار الاستشاري','Pending Consultant'],pcont:['بانتظار المقاول','Pending Contractor'],
 pclient:['بانتظار العميل','Pending Client'],closed:['مغلق','Closed'],rejected:['مرفوض','Rejected']};
function taskSt(t){return t.st&&TST_WF_L[t.st]?t.st:(t.s===2?'closed':t.s===1?'inprog':'open');}
function taskSLA(t){if(!t.d||taskSt(t)==='closed')return 0;
 const diff=(new Date(t.d).getTime()-Date.now())/86400000;
 return diff<0?2:diff<=2?1:0;}
function taskCycle(i){const t=proj().tasks[i];const cur=taskSt(t);
 const nx=TST_WF[(TST_WF.indexOf(cur)+1)%TST_WF.length];
 t.st=nx;if(nx==='closed')t.s=2;else if(nx==='inprog')t.s=1;else if(nx==='open')t.s=0;
 saveDB();logAct(TT('حالة مهمة','Task status'),nx);render();}
function taskSet(i,st){const t=proj().tasks[i];t.st=st;if(st==='closed')t.s=2;saveDB();render();}

let TASKEXP={};
function migrateTaskIds(){
 let dirty=false;
 DB.projects.forEach(function(p){p.tasks.forEach(function(t,i){if(!t.id){t.id=p.id*10000+i+1;dirty=true;}});});
 if(dirty)saveDB();}
function taskSubs(p,tid){return p.tasks.filter(function(x){return x.parent===tid;});}
function taskProg(p,t){
 const subs=taskSubs(p,t.id);
 if(!subs.length)return t.s===2?100:0;
 return Math.round(subs.filter(function(x){return taskSt(x)==='closed'||x.s===2;}).length/subs.length*100);}

const AudioSys={ctx:null,on:true,
 ensure(){if(!this.on)return null;if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}return this.ctx;},
 tone(freq,dur,type,vol,slide){const c=this.ensure();if(!c)return;try{const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(freq,c.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur+0.02);}catch(e){}},
 click(){this.tone(1400,0.05,'square',0.15);},
 thunk(){this.tone(320,0.09,'triangle',0.2,180);},
 ok(){this.tone(880,0.07,'sine',0.1);this.tone(1320,0.09,'sine',0.08);},
 warn(){this.tone(520,0.12,'sawtooth',0.12);},
 alarm(){this.tone(700,0.15,'square',0.15);const s=this;setTimeout(function(){s.tone(700,0.15,'square',0.15);},220);},
 toggle(){this.on=!this.on;try{localStorage.setItem('sim_sound',this.on?'1':'0');}catch(e){}if(this.on)this.ok();return this.on;}};
try{AudioSys.on=localStorage.getItem('sim_sound')!=='0';}catch(e){}

 const t=simTotals();if(t.over)AudioSys.alarm();else if(t.warn)AudioSys.warn();
 render();}
function simPhaseOf(i,c){return c.ph===3?['L1','L2','L3']:['L'+(i%3+1)];}
function simTotals(){
 const kw=[0,0,0];
 CIRCUITS.forEach(function(c,i){if(!SIM.on[i])return;const P=c.P*c.df/(c.ph===3?3:1)/1000;
  simPhaseOf(i,c).forEach(function(ph){kw[+ph[1]-1]+=P;});});
 const tot=kw[0]+kw[1]+kw[2];const load=tot/1000*100;
 return {kw:kw,tot:tot,load:load,warn:load>80&&load<=100,over:load>100};}
function vSim(){
 const tt=simTotals();
 const brk=function(c,i){const on=!!SIM.on[i];const r=designCircuit(c.P*c.df,c.V,c.pf,c.ph,c.len,c.m,0.87,0,0.1,c.sys);
  const phases=simPhaseOf(i,c);
  return '<div class="sim-brk '+(on?'on':'')+'" onclick="simToggle('+i+')">'
   +'<div class="sim-brk-ic">'+(on?'⚡':'⭘')+'</div>'
   +'<div class="sim-brk-lb">'+esc(c.n.split(' ').slice(0,2).join(' '))+'</div>'
   +'<div class="sim-brk-ph">'+phases.join('·')+'</div>'

let WIF={load:1,length:1,res:null};
function computeWhatif(){
 const scen=CIRCUITS.map(function(c){
  const r0=designCircuit(c.P*c.df,c.V,c.pf,c.ph,c.len,c.m,0.87,0,0.1,c.sys);

  return {c:c,r0:r0,r1:r1};});
 const cost0=scen.reduce(function(a,x){return a+x.r0.size*12;},0);
 const cost1=scen.reduce(function(a,x){return a+x.r1.size*12;},0);
 const fails=scen.filter(function(x){return !x.r1.ok;}).length;
 return {rows:scen,cost0:cost0,cost1:cost1,delta:cost1-cost0,fails:fails};}

/* ===== VE ENGINE: honest CAPEX vs OPEX alternatives ===== */
let VE={hours:6000,tariff:2,res:null};
function computeVe(){
 return CIRCUITS.map(function(c){
  const r0=designCircuit(c.P*c.df,c.V,c.pf,c.ph,c.len,c.m,0.87,0,0.1,c.sys);
  const cab0=CABLES.find(function(x){return x.s===r0.size;});
  const sAl=Math.min(240,Math.ceil(r0.size*1.6/2)*2);
  const cabAl=CABLES.find(function(x){return x.s>=sAl;})||CABLES[CABLES.length-1];
  const price0=(PRICE_CABLE[r0.size]||r0.size*12);
  const priceAl=price0*0.45*(cabAl.s/r0.size);
  const capex0=price0*c.len,capexAl=priceAl*c.len;
  const I=r0.inB*0.8;
  const loss0=3*I*I*cab0.r*c.len/1e6, lossAl=3*I*I*cabAl.r*c.len/1e6;
  const opex0=loss0*VE.hours*VE.tariff, opexAl=lossAl*VE.hours*VE.tariff;
  return {c:c,r0:r0,s0:r0.size,sAl:cabAl.s,capex0:capex0,capexAl:capexAl,
   saveC:capex0-capexAl,opex0:opex0,opexAl:opexAl,
   payback:(capexAl-capex0)/(opex0-opexAl)};});}
function runVe(){VE.res=computeVe();if(typeof AudioSys!=='undefined')AudioSys.ok();logAct(TT('تحليل Value Engineering','VE analysis'),'Al alternative');toast('saved');render();}

function takeoffSig(){return JSON.stringify(genTakeoff().map(function(r){return [r.desc,r.qty];}));}
function boqSyncBanner(){
 if(!BOQ.length)return '';
 const cur=takeoffSig();
 const saved=BOQ._sig||'';
 if(saved&&saved!==cur){
  return '<div class="card" style="margin-bottom:12px;border-inline-start:5px solid var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font-size:26px">🔄</span><b>'+TT('البيانات المصدر تغيرت (أحمال/نقاط/SLD) — الـ BOQ قديم','Source data changed — BOQ is stale')+'</b><button class="sm pri" onclick="boqRefresh()">↻ '+TT('تحديث مع الاحتفاظ بأسعاري','Refresh, keep my prices')+'</button></div>';}
 return '';}
function boqRefresh(){
 const fresh=genTakeoff();
 fresh.forEach(function(n){
  const old=BOQ.find(function(o){return o.desc===n.desc;});
  if(old){n.price=old.price;n.id=old.id;n.src=old.src;}});
 BOQ=fresh.map(function(r,i){return Object.assign({id:Date.now()+i},r);});
 BOQ._sig=takeoffSig();boqSave();logAct(TT('مزامنة BOQ','BOQ sync'),BOQ.length+' items');
 toast('saved');render();}
